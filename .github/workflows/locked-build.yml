name: Locked Rust build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  locked-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - name: Verify branch SHA and tracked state
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git switch -c "$EXPECTED_BRANCH"
          git branch --show-current
          git rev-parse --short HEAD
          git status --short
          git diff --exit-code -- Cargo.lock
      - name: Release build without lockfile changes
        run: |
          cargo build --locked --release
          git diff --exit-code -- Cargo.lock
      - name: CP10 byte-exact V10 compiler regression tests
        run: cargo test --locked --release cp10_tests
      - name: CP10 Direct2 packing regression tests
        run: cargo test --locked --release execution_candidates
      - name: CP11 exact evaluator regression suite
        run: cargo test --locked --release cp11_
      - name: CP11 frozen-reference CPU microbenchmark (informational)
        run: cargo test --locked --release cp11_frozen_amount_benchmark -- --ignored --nocapture
      - name: CP12 exact frozen quote differential tests
        run: cargo test --locked --release cp12_
      - name: CP12 controlled frozen assessment and quote benchmark (informational)
        run: |
          cargo test --locked --release cp12_frozen_quote_benchmark -- --ignored --nocapture
          cargo test --locked --release cp12_frozen_amount_benchmark -- --ignored --nocapture
          cargo test --locked --release cp12_repeated_quote_benchmark -- --ignored --nocapture
      - name: CP13 Raydium CPMM directed fee and layout regression tests
        run: cargo test --locked --release cp13_
      - name: CP14 Orca adaptive Clock, directional manifests and registry regression tests
        run: cargo test --locked --release cp14_
      - name: CP14 Orca independent integer reference regression
        run: python scripts/test_cp14_orca_reference.py
      - name: Live utility Python syntax only
        run: python -c "import ast,pathlib; [ast.parse(pathlib.Path(p).read_text(encoding='utf-8')) for p in ('scripts/graph_live_analyze.py','scripts/execution_analyze.py','scripts/cp13_calibration_check.py','scripts/cp14_calibration_check.py','scripts/cp14_orca_reference.py','scripts/test_cp14_orca_reference.py')]"
      - name: Live utility PowerShell syntax only
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @('scripts/runtime_live.ps1', 'scripts/v10_simulation_live.ps1', 'scripts/cp10_capacity_live.ps1', 'scripts/cp11_quantity_live.ps1', 'scripts/cp12_quote_live.ps1', 'scripts/cp13_cpmm_live.ps1','scripts/cp14_orca_live.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Final checkout state
        run: git status --short
