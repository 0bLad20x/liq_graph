name: Locked Rust build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  locked-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - name: Verify branch SHA and tracked state
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git switch -c "$EXPECTED_BRANCH"
          git branch --show-current
          git rev-parse --short HEAD
          git status --short
          git diff --exit-code -- Cargo.lock
      - name: Release build without lockfile changes
        run: |
          cargo build --locked --release
          git diff --exit-code -- Cargo.lock
      - name: Live utility Python syntax only
        run: python -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/graph_live_analyze.py').read_text(encoding='utf-8'))"
      - name: Live utility PowerShell syntax only
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @('scripts/runtime_live.ps1', 'scripts/full_runtime_v10_flashloan_hour.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Final checkout state
        run: git status --short
