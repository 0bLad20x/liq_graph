name: CP4 locked build diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  locked-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - name: Compile feature branch
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked 2>&1 | tee cp4-build-output.log
      - name: Preserve compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp4-build-log
          path: cp4-build-output.log
          if-no-files-found: warn
