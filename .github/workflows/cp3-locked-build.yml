name: CP3 locked build
on:
  push:
    branches: [cp3-central-persistence-dual-registry]
  pull_request:
    branches: [main]
jobs:
  locked-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - run: cargo build --locked
