name: CP6A locked build
on:
  push:
    branches: [cp6a-compact-signal-candidates]
  workflow_dispatch:
jobs:
  locked-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - run: cargo build --locked
