name: CP6B 30m Observability locked build
on:
  push:
    branches: [cp6b-30m-observability]
  workflow_dispatch:
jobs:
  locked-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - name: Python analyzer syntax (no test execution)
        run: python -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/cp6b_analyze_30m.py').read_text(encoding='utf-8'))"
      - name: PowerShell run script syntax (no test execution)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('scripts/cp6b_30m_observability.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Branch and locked build
        run: |
          git branch --show-current
          git rev-parse --short HEAD
          git status --short
          git diff --exit-code -- Cargo.lock
          cargo build --locked
          git diff --exit-code -- Cargo.lock
          git status --short
