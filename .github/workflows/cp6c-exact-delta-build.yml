name: CP6C exact delta locked build
on:
  push:
    branches: [cp6c-exact-graph-delta]
  workflow_dispatch:
jobs:
  locked-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - name: Parse report code (syntax only)
        run: python -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/cp6b_analyze_30m.py').read_text(encoding='utf-8'))"
      - name: Parse Windows launcher (syntax only)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('scripts/cp6c_graph_live.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Verify checkout and build
        run: |
          git branch --show-current
          git rev-parse --short HEAD
          git status --short
          git diff --exit-code -- Cargo.lock
          cargo build --locked
          git diff --exit-code -- Cargo.lock
          git status --short
